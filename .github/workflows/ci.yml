name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm type-check
      - run: pnpm lint
      - name: Lint-staged (staged changes only)
        run: |
          git diff --name-only --diff-filter=ACM HEAD~1 | xargs -r -- pnpm eslint
      - run: pnpm build
